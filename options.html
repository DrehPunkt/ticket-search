<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Ticket-Nummer-Suche – Einstellungen</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px 28px;
      max-width: 560px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.2em;
      margin-bottom: 4px;
    }
    p.hint {
      color: #555;
      font-size: 0.9em;
      line-height: 1.4;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
      font-size: 0.9em;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.95em;
      margin-top: 6px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
    }
    input[type="text"].invalid {
      border-color: #c33;
      background: #fff5f5;
    }
    #pattern-error {
      color: #c33;
      font-size: 0.85em;
      margin-top: 4px;
      min-height: 1.2em;
    }
    #test-result {
      margin-top: 6px;
      font-size: 0.9em;
      min-height: 1.2em;
    }
    .match-yes { color: #178a17; }
    .match-no { color: #888; }
    .buttons {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 7px 16px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 0.9em;
    }
    button#save {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    button#save:disabled {
      background: #9db6ea;
      border-color: #9db6ea;
      cursor: not-allowed;
    }
    #status {
      font-size: 0.85em;
      color: #178a17;
    }
  </style>
</head>
<body>
  <h1>Ticket-Nummer-Suche – Einstellungen</h1>
  <p class="hint">
    Regulärer Ausdruck, mit dem die Ticket-Nummer im Betreff einer E-Mail
    erkannt wird. Der erste Treffer des Musters wird als Ticket-Nummer
    verwendet und für die Suche genutzt.
  </p>

  <label for="pattern">RegEx-Muster</label>
  <input type="text" id="pattern" spellcheck="false"
         placeholder="Ticket#\d{5,}" />
  <div id="pattern-error"></div>

  <label for="test-subject">Testen mit Beispiel-Betreff</label>
  <input type="text" id="test-subject" spellcheck="false"
         placeholder="z.B. Ticket#1234567890" />
  <div id="test-result"></div>

  <div class="buttons">
    <button id="save">Speichern</button>
    <button id="reset">Standard wiederherstellen</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
